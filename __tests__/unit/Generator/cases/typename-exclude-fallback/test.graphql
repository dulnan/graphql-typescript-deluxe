# Query interface with __typename and fragment spreads that don't cover all types.
# This triggers the Exclude<> fallback for types not covered by fragments.
# Animal has 4 implementations (Dog, Cat, Bird, Fish) but we only spread 2 (Dog, Cat).
query typenameExcludeFallback {
  animals {
    __typename
    ...dogFragment
    ...catFragment
  }
}

fragment dogFragment on Dog {
  breed
}

fragment catFragment on Cat {
  color
}
