# Test cases for Omit<> generation
# Omit is needed when fragments have overlapping nested fields with different sub-selections

# =============================================================================
# Test 1: Two fragments on same type with different nested array selections
# =============================================================================
query TwoFragmentsDifferentArraySelections($id: ID!) {
  article(id: $id) {
    ...articleTags
    ...articleTagsExtended
  }
}

fragment articleTags on Article {
  title
  tags {
    id
    name
  }
}

fragment articleTagsExtended on Article {
  body
  tags {
    slug
    color
  }
}

# =============================================================================
# Test 2: Three fragments all selecting same nested field differently
# =============================================================================
query ThreeFragmentsSameNestedField($id: ID!) {
  article(id: $id) {
    ...articleCommentsBasic
    ...articleCommentsWithAuthor
    ...articleCommentsWithReplies
  }
}

fragment articleCommentsBasic on Article {
  title
  comments {
    id
    text
  }
}

fragment articleCommentsWithAuthor on Article {
  excerpt
  comments {
    author {
      name
    }
  }
}

fragment articleCommentsWithReplies on Article {
  body
  comments {
    likes
    replies {
      id
      text
    }
  }
}

# =============================================================================
# Test 3: Nested objects (not arrays) with different selections
# =============================================================================
query NestedObjectDifferentSelections($id: ID!) {
  article(id: $id) {
    ...articleAuthorBasic
    ...articleAuthorWithAvatar
  }
}

fragment articleAuthorBasic on Article {
  title
  author {
    id
    name
  }
}

fragment articleAuthorWithAvatar on Article {
  body
  author {
    email
    avatar {
      url
      alt
    }
  }
}

# =============================================================================
# Test 4: Deep nesting - overlapping at multiple levels
# =============================================================================
query DeepNestingOverlap($id: ID!) {
  article(id: $id) {
    ...articleCategoryBasic
    ...articleCategoryDeep
  }
}

fragment articleCategoryBasic on Article {
  title
  category {
    id
    name
    children {
      id
    }
  }
}

fragment articleCategoryDeep on Article {
  excerpt
  category {
    slug
    children {
      name
      children {
        id
        name
      }
    }
  }
}

# =============================================================================
# Test 5: Interface with fragments - overlapping nested on interface field
# =============================================================================
query InterfaceFragmentsOverlap($id: ID!) {
  content(id: $id) {
    __typename
    ...contentTagsBasic
    ...contentTagsExtended
  }
}

fragment contentTagsBasic on Content {
  id
  tags {
    id
    name
  }
}

fragment contentTagsExtended on Content {
  title
  tags {
    slug
    description
  }
}

# =============================================================================
# Test 6: Inline fragment + fragment spread with overlap
# =============================================================================
query InlineAndFragmentOverlap($id: ID!) {
  article(id: $id) {
    ...articleTagsBasic
    ... on Article {
      tags {
        color
        description
      }
    }
  }
}

fragment articleTagsBasic on Article {
  id
  title
  tags {
    id
    name
  }
}

# =============================================================================
# Test 7: Union type with overlapping selections per member
# =============================================================================
query UnionWithOverlappingFragments($query: String!) {
  search(query: $query) {
    __typename
    ... on Article {
      ...searchArticleOne
      ...searchArticleTwo
    }
    ... on Product {
      ...searchProductOne
      ...searchProductTwo
    }
  }
}

fragment searchArticleOne on Article {
  title
  tags {
    id
    name
  }
}

fragment searchArticleTwo on Article {
  excerpt
  tags {
    slug
  }
}

fragment searchProductOne on Product {
  name
  images {
    url
  }
}

fragment searchProductTwo on Product {
  price
  images {
    alt
    width
  }
}

# =============================================================================
# Test 8: Product with multiple nested arrays all overlapping
# =============================================================================
query ProductMultipleOverlaps($id: ID!) {
  product(id: $id) {
    ...productImagesBasic
    ...productImagesExtended
    ...productCategoriesBasic
    ...productCategoriesExtended
  }
}

fragment productImagesBasic on Product {
  name
  images {
    id
    url
  }
}

fragment productImagesExtended on Product {
  price
  images {
    alt
    caption
  }
}

fragment productCategoriesBasic on Product {
  id
  categories {
    id
    name
  }
}

fragment productCategoriesExtended on Product {
  name
  categories {
    slug
    parent {
      id
      name
    }
  }
}

# =============================================================================
# Test 9: Deeply nested with image field overlapping at leaf
# =============================================================================
query DeeplyNestedImageOverlap($id: ID!) {
