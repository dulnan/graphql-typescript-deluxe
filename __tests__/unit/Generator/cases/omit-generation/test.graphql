# =============================================================================
# Test 10: Page with recursive sections having overlapping nested
# =============================================================================
query PageSectionsOverlap($id: ID!) {
  page(id: $id) {
    ...pageSectionsBasic
    ...pageSectionsWithImage
  }
}

fragment pageSectionsBasic on Page {
