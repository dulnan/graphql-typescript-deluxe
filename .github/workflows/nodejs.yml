name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: build (graphql ${{ matrix.graphql }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        graphql: ['16', '17']

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The lockfile installs graphql 17, the peer dependency also allows 16.
      - name: Install graphql 16
        if: matrix.graphql == '16'
        run: npm install --no-save graphql@16

      - name: unbuild
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Oxlint
        run: npm run lint

      - name: Oxfmt
        run: npm run format

      - name: Vitest
        run: npm run test
